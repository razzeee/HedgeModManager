name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag: 
        description: 'Tag'
        required: true
        default: '8.0.0-beta8'
      prerelease:
        description: 'Prerelease'
        required: true
        type: boolean

env:
  PROJECT_PATH: ./Source/HedgeModManager.UI/HedgeModManager.UI.csproj
  FLATPAK_ID: io.github.hedge_dev.hedgemodmanager
  GENERATOR_URL: https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/refs/heads/master/dotnet/flatpak-dotnet-generator.py
  DOTNET_VERSION: 10
  DOTNET_CLI_HOME: /tmp/.dotnet
  FREEDESKTOP_VERSION: 25.08

jobs:
  build-all:
    name: Build All
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }} SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}.0.x

      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install flatpak-builder -y
      
      - name: Setup Flatpak Cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak/runtime/
          key: flatpak-${{ env.FREEDESKTOP_VERSION }}

      - name: Setup .NET ${{ env.DOTNET_VERSION }} Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DOTNET_CLI_HOME }}
          key: dotnet-${{ env.DOTNET_VERSION }}
  
      - name: Setup Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//${{env.FREEDESKTOP_VERSION}}
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.dotnet${{env.DOTNET_VERSION}}//${{env.FREEDESKTOP_VERSION}}

      - name: Restore Packages
        run: dotnet restore ${{env.PROJECT_PATH}}  

      - name: Generate NuGet Sources
        run: |
          curl -o flatpak-dotnet-generator.py ${{env.GENERATOR_URL}}
          chmod +x flatpak-dotnet-generator.py
          python3 flatpak-dotnet-generator.py ./flatpak/nuget-sources.json ${{env.PROJECT_PATH}} --dotnet ${{env.DOTNET_VERSION}} --freedesktop ${{env.FREEDESKTOP_VERSION}} --runtime linux-x64
      
      - name: Build win-x64
        run: dotnet publish -p:PublishProfile=win-x64 -c Release -o ./output/win-x64 ${{env.PROJECT_PATH}}

      - name: Build linux-x64
        run: dotnet publish -p:PublishProfile=linux-x64 -c Release -o ./output/linux-x64 ${{env.PROJECT_PATH}}

      - name: Build linux-arm64
        run: dotnet publish -p:PublishProfile=linux-arm64 -c Release -o ./output/linux-arm64 ${{env.PROJECT_PATH}}

      - name: Build osx-x64
        run: dotnet publish -p:PublishProfile=osx-x64 -c Release -o ./output/osx-x64 ${{env.PROJECT_PATH}}

      - name: Build osx-arm64
        run: dotnet publish -p:PublishProfile=osx-arm64 -c Release -o ./output/osx-arm64 ${{env.PROJECT_PATH}}

      - name: Package osx-arm64 (Unsigned)
        run: |
          mkdir -p ./output/package-osx-arm64/HedgeModManager.app/Contents/MacOS
          mkdir ./output/package-osx-arm64/HedgeModManager.app/Contents/Resources
          cp -R ./output/osx-arm64/* ./output/package-osx-arm64/HedgeModManager.app/Contents/MacOS
          cp ./data/macOS/Icon.icns ./output/package-osx-arm64/HedgeModManager.app/Contents/Resources/Icon.icns
          cp ./data/macOS/Info.plist ./output/package-osx-arm64/HedgeModManager.app/Contents/Info.plist
          VERSION="${{ github.event.inputs.tag }}"
          sed -i "s/HEDGEMM_VERSION/$VERSION/g" ./output/package-osx-arm64/HedgeModManager.app/Contents/Info.plist

      - name: Package osx-x64 (Unsigned)
        run: |
          mkdir -p ./output/package-osx-x64/HedgeModManager.app/Contents/MacOS
          mkdir ./output/package-osx-x64/HedgeModManager.app/Contents/Resources
          cp -R ./output/osx-x64/* ./output/package-osx-x64/HedgeModManager.app/Contents/MacOS
          cp ./data/macOS/Icon.icns ./output/package-osx-x64/HedgeModManager.app/Contents/Resources/Icon.icns
          cp ./data/macOS/Info.plist ./output/package-osx-x64/HedgeModManager.app/Contents/Info.plist
          VERSION="${{ github.event.inputs.tag }}"
          sed -i "s/HEDGEMM_VERSION/$VERSION/g" ./output/package-osx-x64/HedgeModManager.app/Contents/Info.plist

      - name: Build flatpak-x86_64
        run: flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo builddir ./flatpak/${{env.FLATPAK_ID}}.yml

      - name: Build Flatpak Bundle
        run: flatpak build-bundle repo ./flatpak/${{env.FLATPAK_ID}}.flatpak ${{env.FLATPAK_ID}}

      - name: Prepare Release
        run: |
          mkdir -p ./release
          mv ./output/win-x64/HedgeModManager.UI.exe ./release/HedgeModManager.exe
          mv ./flatpak/${{env.FLATPAK_ID}}.flatpak ./release/${{env.FLATPAK_ID}}.flatpak
          tar -czvf ./release/HedgeModManager-linux-x64.tar.gz ./output/linux-x64
          tar -czvf ./release/HedgeModManager-linux-arm64.tar.gz ./output/linux-arm64
          (cd output/package-osx-x64 && zip -r ../../release/HedgeModManager-osx-x64-unsigned.zip ./HedgeModManager.app)
          (cd output/package-osx-arm64 && zip -r ../../release/HedgeModManager-osx-arm64-unsigned.zip ./HedgeModManager.app)

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./release/*
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}
          name: Hedge Mod Manager ${{ github.event.inputs.tag }}
          tag_name: ${{ github.event.inputs.tag }}
          body: |
            ## Hedge Mod Manager (${{ github.event.inputs.tag }})
            - Added 
            - Fixed 

      - name: Upload NuGet Sources
        uses: actions/upload-artifact@v7
        with:
          name: nuget-sources.json
          path: ./flatpak/nuget-sources.json